[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "poker"
version = "0.1.0"
description = "Stół heads-up (1v1) No-Limit Hold'em z deterministycznymi agentami regułowymi"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Maciej Czekala" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]
# Zależności treningu ML: wyłącznie tools/ i testy reprodukcji (decyzja 06);
# pakiet produktu i inferencja pozostają bezzależnościowe. Wersja przypięta:
# bitowa identyczność regeneracji artefaktów zależy od buildu zależności
# (PUŁAPKA audytu POKER-19); aktualizacja = osobna decyzja z regeneracją.
train = [
  "numpy==2.5.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/poker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# `tools/blueprint` wchodzi do bramki (POKER-49): 2,9 tys. linii dostarczonych
# przez POKER-46/47 było poza `files`, więc `verification: mypy` było wobec nich
# puste. Reszta `tools/` to skrypty sprzed tej reguły — osobny dług.
files = ["src", "tests", "tools/blueprint"]
